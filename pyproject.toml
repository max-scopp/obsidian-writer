[project]
name = "obsidian-writer"
version = "0.1.0"
description = "FastAPI service exposing read/write/trash operations on an Obsidian vault, designed for AI-agent clients."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "max-scopp" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "watchfiles>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_writer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
    "B008",  # FastAPI's `Depends()` idiom requires call-in-default
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240"]  # sync filesystem I/O is fine in unit tests
"src/obsidian_writer/app.py" = ["ASYNC240"]  # lifespan startup is one-shot sync I/O

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
